name: BIKI Billing Android APK
on:
  push:
    branches: [android-app]
    paths:
      - 'android-app/**'
      - '.github/workflows/biki-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Use existing shop icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          if [ -f favicon.png ]; then
            cp favicon.png android-app/app/src/main/res/drawable-nodpi/biki_icon.png
            rm android-app/app/src/main/res/drawable/biki_icon.xml
          fi
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk BIKI-Billing-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIKI-Billing-Android
          path: BIKI-Billing-v1.0.apk
          if-no-files-found: error
