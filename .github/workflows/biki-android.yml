name: BIKI Billing Android APK
on:
  push:
    branches: [android-app]
    paths:
      - 'android-app/**'
      - '.github/workflows/biki-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK without legacy tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$MANAGER" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl --fail --retry 3 -L https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
          "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Use existing shop icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          if [ -f favicon.png ]; then
            cp favicon.png android-app/app/src/main/res/drawable-nodpi/biki_icon.png
            rm android-app/app/src/main/res/drawable/biki_icon.xml
          fi
      - name: Check app UI JavaScript syntax
        run: node --check android-app/app/src/main/assets/native-v2.js
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk BIKI-Billing-v2.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIKI-Billing-PRO-V2-1
          path: BIKI-Billing-v2.1.apk
          if-no-files-found: error
