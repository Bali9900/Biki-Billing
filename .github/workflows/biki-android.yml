name: BIKI Billing Android Release
on:
  push:
    branches: [android-app]
    paths:
      - 'android-app/**'
      - '.github/workflows/biki-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK without legacy tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$MANAGER" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl --fail --retry 3 -L https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
          "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"
      - name: Use existing shop icon
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          if [ -f favicon.png ]; then
            cp favicon.png android-app/app/src/main/res/drawable-nodpi/biki_icon.png
            rm android-app/app/src/main/res/drawable/biki_icon.xml
          fi
      - name: Check app UI JavaScript syntax
        run: node --check android-app/app/src/main/assets/native-v2.js
      - name: Check secure signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BIKI_RELEASE_KEYSTORE_BASE64 }}
          BIKI_RELEASE_STORE_PASSWORD: ${{ secrets.BIKI_RELEASE_STORE_PASSWORD }}
          BIKI_RELEASE_KEY_ALIAS: ${{ secrets.BIKI_RELEASE_KEY_ALIAS }}
          BIKI_RELEASE_KEY_PASSWORD: ${{ secrets.BIKI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$BIKI_RELEASE_STORE_PASSWORD" ] || [ -z "$BIKI_RELEASE_KEY_ALIAS" ] || [ -z "$BIKI_RELEASE_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured. Compile validation only; no installable APK will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/biki-release.jks"
          echo "BIKI_RELEASE_KEYSTORE=$RUNNER_TEMP/biki-release.jks" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Validate release compilation
        if: steps.signing.outputs.ready != 'true'
        run: gradle -p android-app :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Build signed APK and Play App Bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          BIKI_RELEASE_STORE_PASSWORD: ${{ secrets.BIKI_RELEASE_STORE_PASSWORD }}
          BIKI_RELEASE_KEY_ALIAS: ${{ secrets.BIKI_RELEASE_KEY_ALIAS }}
          BIKI_RELEASE_KEY_PASSWORD: ${{ secrets.BIKI_RELEASE_KEY_PASSWORD }}
        run: gradle -p android-app :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify signed artifacts
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp android-app/app/build/outputs/apk/release/app-release.apk release-output/BIKI-Billing-v3.2.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab release-output/BIKI-Billing-v3.2.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-output/BIKI-Billing-v3.2.apk
          jarsigner -verify release-output/BIKI-Billing-v3.2.aab
          (cd release-output && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: BIKI-Billing-PRO-V3-2-Signed
          path: release-output/
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/biki-release.jks"
